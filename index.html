<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src blob: data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>纸上编织实验室</title><link rel="stylesheet" href="style.css"><script defer src="pattern.js"></script><script defer src="app.js"></script></head><body><main><header><p>PAPER WEAVE / 图案重复实验</p><h1>一上一下，<br>织出一个重复。</h1><p>改变一个交叠点，看看接缝之外发生什么。</p></header><div class="workspace"><section class="controls"><h2>01 · 编辑单元</h2><label>单元大小<select id="size"><option>4</option><option>6</option><option selected>8</option><option>12</option></select></label><label>起始图案<select id="preset"><option value="plain">交替</option><option value="diagonal">斜向</option><option value="basket">双格</option></select></label><button id="apply">应用起始图案</button><label>配色<select id="palette"><option value="ink">墨绿 / 沙色</option><option value="clay">陶土 / 米色</option><option value="sea">海蓝 / 薄荷</option></select></label><p class="hint">实心表示竖条在上，空心表示横条在上。点击或空格切换；方向键移动，Tab 离开。</p><div class="gridwrap"><div id="grid" aria-label="交叠点编辑器"></div></div><div class="actions"><button id="undo" disabled>撤销</button><button id="invert">反转全部</button></div><button id="save">保存作品 JSON</button><label>打开作品 JSON<input id="load" type="file" accept=".json,application/json"></label><p id="status" role="status">不会自动保存。关闭前请保存需要保留的作品。</p></section><section class="preview"><h2>02 · 三乘三平铺</h2><img id="image" alt="当前交叠单元重复三乘三的纸条示意图"><div class="actions"><button id="svg">导出 SVG</button><button id="png">导出 PNG</button></div><h2>03 · 检查接缝</h2><p id="summary"></p><p class="hint">统计每行与每列中两种状态的连续长度。整行同色在无限重复时会无限延伸，不是有限长度。这里只检查图案，不判断能否织造。</p><details><summary>查看每条线的数值</summary><table><thead><tr><th>方向 / 编号</th><th>单元内最长</th><th>跨缝最长</th></tr></thead><tbody id="rows"></tbody></table></details></section></div><footer>离线 · 零上传 · 不生成织机指令 · 非布料物理模拟 · <a href="README.md">使用说明</a></footer></main></body></html>
